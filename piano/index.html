<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>Piano</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#111;color:#eee;font:600 14px system-ui,-apple-system,sans-serif;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#bar{flex:0 0 auto;height:42px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#1c1c1c}
#bar a,#bar button{color:#eee;background:#2c2c2c;border:0;border-radius:8px;height:32px;min-width:38px;padding:0 10px;font:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
#bar button.on{background:#c79a3a;color:#111}
#oct{min-width:34px;text-align:center;opacity:.8}
#vol{width:90px;accent-color:#c79a3a}
.sp{flex:1}
#bar [hidden]{display:none}
#kb{flex:1;position:relative;margin:4px 4px 6px;touch-action:none}
.k{position:absolute;top:0;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:13px}
.w{background:linear-gradient(#f4f4f0,#fff 85%,#e6e6e0);height:100%;border:1px solid #999;color:#666;z-index:1}
.b{background:linear-gradient(#333,#111);height:60%;z-index:2;color:#aaa;font-size:10px;border:1px solid #000;box-shadow:0 3px 4px #0008}
.w.down{background:linear-gradient(#e2d2a8,#f0dca8)}
.b.down{background:linear-gradient(#7a5a1a,#4a360c)}
.k span{pointer-events:none}
.nolabels .k span{display:none}

#songsBtn.on,#lbar button.on{background:#3aa0c7;color:#111}
.k.next{box-shadow:inset 0 0 0 3px #39d0ff,0 0 18px #39d0ffcc;z-index:3}
.w.next{z-index:1;background:linear-gradient(#bfefff,#7fdcff)}
.b.next{background:linear-gradient(#1b8fbf,#0b5f86)}
.w.after{background:linear-gradient(#f4f4f0,#dff5ec)}.b.after{background:linear-gradient(#2a4a40,#123028)}
.k.after{box-shadow:inset 0 0 0 2px #5fdca099}
.k.pulse{animation:pulse .3s}@keyframes pulse{0%{transform:scale(.94)}100%{transform:scale(1)}}
.k.wrong{background:linear-gradient(#ffb0b0,#e06060)!important;transition:none}
#lbar{display:none;flex:0 0 auto;height:34px;align-items:center;gap:6px;padding:0 8px;background:#14232a}
#lbar.show{display:flex}
#lbar button{color:#eee;background:#24404a;border:0;border-radius:8px;height:28px;padding:0 10px;font:inherit}
#ltitle{max-width:28%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.85}
#lprog{flex:1;height:8px;background:#0006;border-radius:4px;overflow:hidden;min-width:40px}
#lprog i{display:block;height:100%;width:0;background:#39d0ff;transition:width .15s}
#lstep{min-width:86px;text-align:right;font-variant-numeric:tabular-nums}
#sheet{display:none;position:fixed;inset:0;z-index:8;background:#000a;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .panel{background:#1d1d1d;width:min(640px,100%);max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));touch-action:pan-y}
#sheet h2{font-size:16px;margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center}
#sheet h2 button{background:#333;color:#eee;border:0;border-radius:8px;height:34px;width:40px;font:inherit}
.song{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:#2a2a2a;color:#eee;border:0;border-radius:10px;padding:12px 14px;margin:0 0 8px;font:inherit;font-size:15px}
.song small{display:block;opacity:.6;font-weight:500;font-size:12px}.song b{flex:1}
.song.feat{background:#173847;box-shadow:inset 0 0 0 2px #39d0ff}
.song em{font-style:normal;font-size:11px;background:#39d0ff;color:#111;border-radius:6px;padding:2px 6px}
#rot{display:none;position:fixed;inset:0;z-index:9;background:#111;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;font-size:18px}
#rot div{font-size:54px;animation:r 2s infinite}
@keyframes r{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:820px){#rot{display:flex}}
</style>
</head>
<body>
<div id="app">
 <div id="bar">
  <a href="../" aria-label="Back to games">←</a>
  <button id="lab">C D E</button>
  <button id="od" aria-label="Octave down">−</button><span id="oct">C4</span><button id="ou" aria-label="Octave up">+</button>
  <button id="sus">Sustain</button>
  <button id="songsBtn">♪ Songs</button>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  <span class="sp"></span>
  <button id="fs" aria-label="Fullscreen" hidden>⛶</button>
 </div>
 <div id="lbar"><span id="ltitle"></span><div id="lprog"><i></i></div><span id="lstep"></span>
  <button id="lmode" title="Wait for me / follow the tempo">Wait</button><button id="ldemo">▶ Listen</button><button id="lrestart">↺</button><button id="lexit" aria-label="Exit song">✕</button></div>
 <div id="kb"></div>
</div>
<div id="sheet"><div class="panel"><h2>Learn a song <button id="sheetX" aria-label="Close">✕</button></h2><div id="songlist"></div></div></div>
<div id="rot"><div>📱</div>Rotate your phone to play</div>
<script src="songs.js?v1"></script>
<script>
(() => {
const kb = document.getElementById('kb');
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SOLF = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const BASE = 60;                // C4
const COUNT = 25;               // C4..C6
let shift = 0, labelMode = 0, sustain = false;
const keys = [];                // {el, idx}
// ---------- layout ----------
const whites = []; for (let i=0;i<COUNT;i++) if (![1,3,6,8,10].includes(i%12)) whites.push(i);
function build(){
  kb.innerHTML=''; keys.length=0;
  const ww = 100/whites.length;
  let wi = 0;
  for (let i=0;i<COUNT;i++){
    const black = [1,3,6,8,10].includes(i%12);
    const el = document.createElement('div');
    el.className = 'k ' + (black?'b':'w');
    el.dataset.i = i;
    if (black){ el.style.left = (wi*ww - ww*0.31)+'%'; el.style.width = (ww*0.62)+'%'; }
    else { el.style.left = (wi*ww)+'%'; el.style.width = ww+'%'; wi++; }
    el.appendChild(document.createElement('span'));
    kb.appendChild(el); keys[i]=el;
  }
  labels();
}
function labels(){
  keys.forEach((el,i)=>{
    const m = BASE+shift*12+i, n = m%12, o = Math.floor(m/12)-1;
    el.firstChild.textContent = labelMode===1 ? SOLF[n] : NAMES[n]+o;
  });
  kb.classList.toggle('nolabels', labelMode===2);
  document.getElementById('lab').textContent = ['C D E','Do Re Mi','No labels'][labelMode];
  document.getElementById('oct').textContent = 'C'+(4+shift);
}
// ---------- audio ----------
let ctx, master, comp;
function audio(){
  if (!ctx){
    ctx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    comp = ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    master = ctx.createGain(); master.gain.value = vol.value;
    master.connect(comp).connect(ctx.destination);
  }
  if (ctx.state !== 'running') ctx.resume();
  return ctx;
}
const voices = new Map();       // key idx -> voice
const held = new Set();         // key idx physically held
function noteOn(i, vel=0.9){
  const c = audio(), t = c.currentTime;
  if (voices.has(i)) release(i, 0.03);
  const midi = BASE+shift*12+i, f = 440*Math.pow(2,(midi-69)/12);
  const out = c.createGain(), lp = c.createBiquadFilter();
  lp.type='lowpass'; lp.Q.value=0.7;
  lp.frequency.setValueAtTime(Math.min(16000, f*10), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(600, f*2.5), t+1.6);
  const decay = 1.2 + 5*Math.pow(0.97, midi-48);   // low notes ring longer
  const peak = 0.32*vel;
  out.gain.setValueAtTime(0.0001, t);
  out.gain.linearRampToValueAtTime(peak, t+0.004);
  out.gain.exponentialRampToValueAtTime(peak*0.45, t+0.25);
  out.gain.exponentialRampToValueAtTime(0.0001, t+decay);
  const parts = [[1,1,0],[1,0.5,6],[2,0.38,-4],[3,0.16,3],[4,0.1,-2],[5,0.05,4],[6,0.03,0]];
  const oscs = [];
  for (const [h,a,det] of parts){
    if (f*h > 18000) continue;
    const o = c.createOscillator(), g = c.createGain();
    o.type = h===1 ? 'triangle' : 'sine';
    o.frequency.value = f*h*(1+0.0004*h*h);  // slight inharmonicity
    o.detune.value = det;
    g.gain.setValueAtTime(a, t);
    g.gain.exponentialRampToValueAtTime(a*0.2+0.0001, t+decay*0.6/h);
    o.connect(g).connect(lp); o.start(t); o.stop(t+decay+0.1); oscs.push(o);
  }
  // hammer click
  const nb = c.createBuffer(1, c.sampleRate*0.03|0, c.sampleRate), d = nb.getChannelData(0);
  for (let k=0;k<d.length;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,3);
  const ns = c.createBufferSource(), ng = c.createGain(), nf = c.createBiquadFilter();
  ns.buffer=nb; nf.type='bandpass'; nf.frequency.value=Math.min(8000,f*4); ng.gain.value=0.06*vel;
  ns.connect(nf).connect(ng).connect(out); ns.start(t);
  lp.connect(out).connect(master);
  voices.set(i, {out, oscs});
  keys[i]?.classList.add('down');
  window.__notes && window.__notes.push(NAMES[midi%12]+(Math.floor(midi/12)-1));
}
function release(i, time=0.35){
  const v = voices.get(i); if (!v) return;
  const t = ctx.currentTime;
  v.out.gain.cancelScheduledValues(t);
  v.out.gain.setTargetAtTime(0.0001, t, time/4);
  v.oscs.forEach(o=>{ try{o.stop(t+time+0.05)}catch(e){} });
  voices.delete(i);
}
function keyDown(i){ held.add(i); noteOn(i); learnHit(i); }
function keyUp(i){ held.delete(i); keys[i]?.classList.remove('down'); if (!sustain) release(i); }
// ---------- pointers (multi-touch + glissando) ----------
const ptr = new Map();          // pointerId -> key idx
function keyAt(x,y){
  const el = document.elementFromPoint(x,y);
  const k = el && el.closest && el.closest('.k');
  return k ? +k.dataset.i : -1;
}
kb.addEventListener('pointerdown', e=>{
  e.preventDefault(); audio();
  try{ kb.releasePointerCapture?.(e.pointerId) }catch(_){}
  const i = keyAt(e.clientX,e.clientY); ptr.set(e.pointerId,i);
  if (i>=0) keyDown(i);
});
kb.addEventListener('pointermove', e=>{
  if (!ptr.has(e.pointerId)) return;
  const i = keyAt(e.clientX,e.clientY), prev = ptr.get(e.pointerId);
  if (i===prev) return;
  ptr.set(e.pointerId,i);
  if (prev>=0 && ![...ptr.values()].includes(prev)) keyUp(prev);
  if (i>=0) keyDown(i);
});
function up(e){
  if (!ptr.has(e.pointerId)) return;
  const prev = ptr.get(e.pointerId); ptr.delete(e.pointerId);
  if (prev>=0 && ![...ptr.values()].includes(prev)) keyUp(prev);
}
['pointerup','pointercancel','pointerleave'].forEach(t=>kb.addEventListener(t,up));
// block gestures / menus
['touchstart','touchmove','gesturestart','dblclick'].forEach(t=>document.addEventListener(t,e=>{ if(!e.target.closest("button,a,input,#sheet .panel")) e.preventDefault(); },{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
// unlock on first touch (iOS)
const unlock = ()=>{ audio(); const b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0); };
['touchend','pointerdown','keydown'].forEach(t=>document.addEventListener(t,unlock,{once:true,capture:true}));
// ---------- controls ----------
const $ = id=>document.getElementById(id);
const vol = $('vol');
vol.addEventListener('input',()=>{ if(master) master.gain.value = vol.value; });
$('lab').onclick = ()=>{ labelMode=(labelMode+1)%3; labels(); };
$('od').onclick = ()=>{ if(shift>-3){ shift--; labels(); } };
$('ou').onclick = ()=>{ if(shift<2){ shift++; labels(); } };
$('sus').onclick = ()=>{ sustain=!sustain; $('sus').classList.toggle('on',sustain);
  if(!sustain) [...voices.keys()].forEach(i=>{ if(!held.has(i)) release(i); }); };
const fsb = $('fs'), root = document.documentElement;
if ((root.requestFullscreen || root.webkitRequestFullscreen) && !/iPhone|iPad|iPod/.test(navigator.userAgent)) {
  fsb.hidden = false;
  fsb.onclick = ()=>{ if (document.fullscreenElement) document.exitFullscreen();
    else (root.requestFullscreen||root.webkitRequestFullscreen).call(root).then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{}); };
}
// ---------- desktop keyboard ----------
const MAP = 'zsxdcvgbhnjmq2w3er5t6y7ui';   // 25 keys C4..C6
const kdown = new Set();
addEventListener('keydown', e=>{
  if (e.repeat || e.ctrlKey || e.metaKey) return;
  if (e.key===' '){ e.preventDefault(); $('sus').click(); return; }
  if (e.key==='ArrowLeft') return $('od').click();
  if (e.key==='ArrowRight') return $('ou').click();
  const i = MAP.indexOf(e.key.toLowerCase());
  if (i>=0 && !kdown.has(i)){ kdown.add(i); keyDown(i); }
});
addEventListener('keyup', e=>{
  const i = MAP.indexOf(e.key.toLowerCase());
  if (i>=0 && kdown.has(i)){ kdown.delete(i); keyUp(i); }
});
addEventListener('blur', ()=>{ [...held].forEach(keyUp); kdown.clear(); ptr.clear(); });
// ---------- learn mode ----------
const SONGS = window.PIANO_SONGS || [];
const toMidi = s => { const m = /^([A-G])(#|b)?(\d)$/.exec(s); return (m[3]*1+1)*12 + [0,2,4,5,7,9,11]['CDEFGAB'.indexOf(m[1])] + (m[2]==='#'?1:m[2]==='b'?-1:0); };
const L = { song:null, steps:[], pos:0, follow:false, demo:null, timer:null };
window.__learn = L;
const sheet = $('sheet'), list = $('songlist');
SONGS.forEach((sg,k)=>{ const b=document.createElement('button'); b.className='song'+(sg.featured?' feat':'');
  b.innerHTML=`<b>${sg.title}<small>${sg.subtitle||''}</small></b>${k===0?'<em>FIRST</em>':''}`; b.onclick=()=>{ sheet.classList.remove('show'); startSong(sg); }; list.appendChild(b); });
$('songsBtn').onclick=()=>sheet.classList.add('show');
$('sheetX').onclick=()=>sheet.classList.remove('show');
sheet.addEventListener('pointerdown',e=>{ if(e.target===sheet) sheet.classList.remove('show'); });
function startSong(sg){
  stopDemo(); L.song=sg;
  // transpose into C4..C6 by octaves if needed, then pick octave view
  let ms = sg.notes.filter(x=>!x.rest).map(x=>toMidi(x.note));
  let t = 0; const lo=Math.min(...ms), hi=Math.max(...ms);
  if (hi-lo<=24){ while(lo+t<36) t+=12; while(hi+t>96) t-=12; }
  let sh = Math.max(-3,Math.min(2,Math.floor((lo+t-BASE)/12)));
  if (hi+t > BASE+sh*12+COUNT-1) sh = Math.min(2, Math.ceil((hi+t-BASE-COUNT+1)/12));
  shift = sh; labels();
  L.steps=[]; let beat=0;
  sg.notes.forEach(x=>{ if(!x.rest) L.steps.push({midi:toMidi(x.note)+t, beat, dur:x.dur}); beat+=x.dur; });
  $('ltitle').textContent=sg.title; $('lbar').classList.add('show'); $('songsBtn').classList.add('on');
  restart();
}
function restart(){ stopDemo(); L.pos=0; L.t0=null; render(true); }
function exitSong(){ stopDemo(); L.song=null; L.steps=[]; clearMarks(); $('lbar').classList.remove('show'); $('songsBtn').classList.remove('on'); }
function clearMarks(){ keys.forEach(k=>k.classList.remove('next','after')); }
const keyOf = midi => midi-(BASE+shift*12);
const nm = midi => NAMES[midi%12]+(Math.floor(midi/12)-1);
function render(pulse){
  clearMarks(); const n=L.steps.length, st=L.steps[L.pos];
  $('lprog').firstChild.style.width=(100*L.pos/n)+'%';
  if (!st){ $('lstep').textContent='Done! 🎉 '+n+'/'+n; return; }
  $('lstep').textContent=`${nm(st.midi)} • ${L.pos+1}/${n}`;
  const nx=L.steps[L.pos+1];
  if (nx && nx.midi!==st.midi) keys[keyOf(nx.midi)]?.classList.add('after');
  const el=keys[keyOf(st.midi)];
  if (el){ el.classList.add('next'); if(pulse){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); } }
}
function learnHit(i){
  if (!L.song || L.demo || L.pos>=L.steps.length) return;
  const midi=BASE+shift*12+i, st=L.steps[L.pos];
  if (midi===st.midi){ L.pos++; if(L.follow) scheduleFollow(); render(true); }
  else { const el=keys[i]; el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),180); }
}
// follow-the-tempo: if the player doesn't hit the next note in time, it advances anyway
function scheduleFollow(){
  clearTimeout(L.timer); const st=L.steps[L.pos-1]; if(!st || L.pos>=L.steps.length) return;
  const gap=(L.steps[L.pos].beat-st.beat)*60000/L.song.tempo;
  L.timer=setTimeout(()=>{ if(L.pos<L.steps.length && !L.demo){ L.pos++; render(true); scheduleFollow(); } }, gap*1.6+250);
}
function stopDemo(){ clearTimeout(L.timer); if(L.demo){ L.demo.forEach(clearTimeout); L.demo=null; } $('ldemo').textContent='▶ Listen'; }
$('ldemo').onclick=()=>{
  if (L.demo){ stopDemo(); render(); return; }
  if (!L.song) return; audio(); stopDemo(); L.demo=[]; $('ldemo').textContent='■ Stop';
  const spb=60000/L.song.tempo;
  L.steps.forEach((st,k)=>{
    L.demo.push(setTimeout(()=>{ const i=keyOf(st.midi); L.pos=k; render(); if(keys[i]){ noteOn(i,0.8); keys[i].classList.add('down');
      setTimeout(()=>{ keys[i].classList.remove('down'); if(!sustain) release(i); }, Math.max(90, st.dur*spb*0.9)); } }, st.beat*spb+60));
  });
  const last=L.steps[L.steps.length-1];
  L.demo.push(setTimeout(()=>{ stopDemo(); L.pos=0; render(true); window.__demoDone=true; }, (last.beat+last.dur)*spb+300));
};
$('lrestart').onclick=restart; $('lexit').onclick=exitSong;
$('lmode').onclick=()=>{ L.follow=!L.follow; $('lmode').textContent=L.follow?'Tempo':'Wait'; $('lmode').classList.toggle('on',L.follow); clearTimeout(L.timer); };
const _labels = labels; labels = function(){ _labels(); if(L && L.song) render(); };
build();
})();
</script>
</body>
</html>
