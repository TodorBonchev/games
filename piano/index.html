<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#111;color:#eee;font:600 14px system-ui,-apple-system,sans-serif;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#bar{flex:0 0 auto;height:42px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#1c1c1c}
#bar a,#bar button{color:#eee;background:#2c2c2c;border:0;border-radius:8px;height:32px;min-width:38px;padding:0 10px;font:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
#bar button.on{background:#c79a3a;color:#111}
#oct{min-width:34px;text-align:center;opacity:.8}
#vol{width:90px;accent-color:#c79a3a}
.sp{flex:1}
#bar [hidden]{display:none}
#kb{flex:1;position:relative;margin:4px 4px 6px;touch-action:none}
.k{position:absolute;top:0;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:13px}
.w{background:linear-gradient(#f4f4f0,#fff 85%,#e6e6e0);height:100%;border:1px solid #999;color:#666;z-index:1}
.b{background:linear-gradient(#333,#111);height:60%;z-index:2;color:#aaa;font-size:10px;border:1px solid #000;box-shadow:0 3px 4px #0008}
.w.down{background:linear-gradient(#e2d2a8,#f0dca8)}
.b.down{background:linear-gradient(#7a5a1a,#4a360c)}
.k span{pointer-events:none}
.nolabels .k span{display:none}

#songsBtn.on,#lbar button.on{background:#3aa0c7;color:#111}
.k.next{box-shadow:inset 0 0 0 3px #39d0ff,0 0 18px #39d0ffcc;z-index:3}
.w.next{z-index:1;background:linear-gradient(#bfefff,#7fdcff)}
.b.next{background:linear-gradient(#1b8fbf,#0b5f86)}
.w.after{background:linear-gradient(#f4f4f0,#dff5ec)}.b.after{background:linear-gradient(#2a4a40,#123028)}
.k.after{box-shadow:inset 0 0 0 2px #5fdca099}
.k.pulse{animation:pulse .3s}@keyframes pulse{0%{transform:scale(.94)}100%{transform:scale(1)}}
.k.wrong{background:linear-gradient(#ffb0b0,#e06060)!important;transition:none}
#lbar{display:none;flex:0 0 auto;height:34px;align-items:center;gap:6px;padding:0 8px;background:#14232a}
#lbar.show{display:flex}
#lbar button{color:#eee;background:#24404a;border:0;border-radius:8px;height:28px;padding:0 10px;font:inherit;white-space:nowrap;flex:0 0 auto}
#ltitle{max-width:28%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.85}

#lprog i{display:block;height:100%;width:0;background:#39d0ff;transition:width .15s}
#lstep{min-width:86px;text-align:right;font-variant-numeric:tabular-nums}

#sheet.show{display:flex}
#sheet .panel{background:#1d1d1d;width:min(640px,100%);max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));touch-action:pan-y}
#sheet h2{font-size:16px;margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center}
#songq{flex:1;margin:0 10px;height:34px;border-radius:8px;border:0;background:#333;color:#eee;padding:0 10px;font:inherit;font-size:15px;min-width:0}
#sheet h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin:12px 4px 6px}
.lvl{font-style:normal;font-size:11px;border-radius:6px;padding:2px 7px;margin-left:6px}.lvl.Easy{background:#2f6b3c}.lvl.Medium{background:#7a5f1c}.lvl.Hard{background:#7a2a2a}
.none{opacity:.6;padding:10px}
#sheet h2 button{background:#333;color:#eee;border:0;border-radius:8px;height:34px;width:40px;font:inherit}
.song{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:#2a2a2a;color:#eee;border:0;border-radius:10px;padding:12px 14px;margin:0 0 8px;font:inherit;font-size:15px}
.song small{display:block;opacity:.6;font-weight:500;font-size:12px}.song b{flex:1}
.song.feat{background:#173847;box-shadow:inset 0 0 0 2px #39d0ff}
.song em{font-style:normal;font-size:11px;background:#39d0ff;color:#111;border-radius:6px;padding:2px 6px}
#rot{display:none;position:fixed;inset:0;z-index:9;background:#111;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;font-size:18px}
#rot div{font-size:54px;animation:r 2s infinite}
@keyframes r{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:820px){#rot{display:flex}body.portraitok #rot{display:none}
 #lbar{height:auto;flex-wrap:wrap;padding:4px 8px}#ltitle{max-width:100%;flex-basis:100%}#vol{display:none}}
#rot button{background:#333;color:#eee;border:0;border-radius:10px;padding:10px 16px;font:inherit;animation:none}
#lstate{font-size:12px;padding:2px 8px;border-radius:6px;background:#0005;white-space:nowrap}
#lstate[data-state=playing]{background:#2f6b3c}#lstate[data-state=paused]{background:#7a5f1c}#lstate[data-state=listening]{background:#1b6f99}#lstate[data-state=done]{background:#6b2f6b}
#lbar button:disabled{opacity:.4}
#bar button.hint{background:#39d0ff;color:#111;animation:glow .7s infinite alternate}@keyframes glow{from{box-shadow:0 0 0 #39d0ff}to{box-shadow:0 0 14px #39d0ff}}

#done.show{display:flex}
#done .panel{background:#1d1d1d;border-radius:16px;padding:18px 22px;text-align:center;display:flex;flex-direction:column;gap:8px;max-width:92%}

#done .row{display:flex;gap:8px;justify-content:center;margin-top:6px}
#done button{background:#2c2c2c;color:#eee;border:0;border-radius:8px;height:36px;padding:0 14px;font:inherit}#dagain{background:#3aa0c7!important;color:#111!important}
#staff{display:none;flex:0 0 64px;margin:4px 4px 0;background:#f6f2e6;border-radius:8px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#staff::-webkit-scrollbar{display:none}
body.staffon #staff.has{display:block}
#staff svg{display:block;height:100%}
#staff .n{color:#1f1f1f;cursor:pointer}#staff .n.played{color:#a3a3a3}#staff .n.cur{color:#1592c9}#staff .n.nxt{color:#21a35e}
#staff .hit{fill:transparent}#staff .n.cur .hit{fill:#39d0ff33}#staff .n.nxt .hit{fill:#5fdca022}
#staff .ln{stroke:#555;stroke-width:1}#staff .bm{fill:#1f1f1f}#staff .bm.played{fill:#a3a3a3}
@media (max-height:340px){#staff{flex-basis:56px}#bar{height:36px}#lbar{height:30px}#lbar button{height:24px;padding:0 7px}#lstep{min-width:60px}}
#sndBtn{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sndBtn.loading::after{content:'';width:10px;height:10px;margin-left:6px;border:2px solid #c79a3a;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
#sndMenu{display:none;position:fixed;z-index:8;inset:0;background:#0006}
#sndMenu.show{display:block}
#sndMenu .panel{position:absolute;top:calc(env(safe-area-inset-top) + 44px);left:50%;transform:translateX(-50%);width:min(560px,94vw);max-height:calc(100% - 54px);overflow:auto;background:#1d1d1d;border-radius:12px;padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;touch-action:pan-y;box-shadow:0 8px 24px #000a}
#sndMenu .opt{background:#2a2a2a;color:#eee;border:0;border-radius:8px;padding:6px 9px;font:inherit;text-align:left;min-height:34px}
#sndMenu .opt small{display:block;opacity:.6;font-weight:500;font-size:11px}
#sndMenu .opt.on{background:#c79a3a;color:#111}
#sndMenu .row{grid-column:1/-1;display:flex;align-items:center;gap:8px;justify-content:space-between}
#sndMenu #rvb{background:#2a2a2a;color:#eee;border:0;border-radius:8px;height:32px;padding:0 12px;font:inherit}#sndMenu #rvb.on{background:#c79a3a;color:#111}
#sndMenu .credit{grid-column:1/-1;font-size:10px;font-weight:500;opacity:.55;padding:2px 4px}
#sndMenu .credit a{color:inherit}
#sndStat{font-size:11px;opacity:.7;font-weight:500}
</style>

<div id="app">
 <div id="bar">

 </div>
 <div id="lbar"><span id="ltitle"></span><div id="lprog"><i></i></div><span id="lstep"></span>

 <div class="row"><button id="rvb" aria-pressed="false">Reverb</button><span id="sndStat"></span></div>
 <div class="credit">Sampled sounds: FluidR3_GM SoundFont by Frank Wen, via <a href="https://github.com/gleitz/midi-js-soundfonts" target="_blank" rel="noopener">gleitz/midi-js-soundfonts</a> — CC BY 3.0. Falls back to the built-in synth when offline.</div></div></div>

<script src="songs.js?v5"></script>
<script>
(() => {
const kb = document.getElementById('kb');
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SOLF = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const BASE = 60;                // C4
const COUNT = 25;               // C4..C6
let shift = 0, labelMode = 0, sustain = false;
const keys = [];                // {el, idx}
// ---------- layout ----------
const whites = []; for (let i=0;i<COUNT;i++) if (![1,3,6,8,10].includes(i%12)) whites.push(i);
function build(){
  kb.innerHTML=''; keys.length=0;
  const ww = 100/whites.length;
  let wi = 0;
  for (let i=0;i<COUNT;i++){
    const black = [1,3,6,8,10].includes(i%12);
    const el = document.createElement('div');
    el.className = 'k ' + (black?'b':'w');
    el.dataset.i = i;
    if (black){ el.style.left = (wi*ww - ww*0.31)+'%'; el.style.width = (ww*0.62)+'%'; }
    else { el.style.left = (wi*ww)+'%'; el.style.width = ww+'%'; wi++; }
    el.appendChild(document.createElement('span'));
    kb.appendChild(el); keys[i]=el;
  }
  labels();
}
function labels(){
  keys.forEach((el,i)=>{
    const m = BASE+shift*12+i, n = m%12, o = Math.floor(m/12)-1;
    el.firstChild.textContent = labelMode===1 ? SOLF[n] : NAMES[n]+o;
  });
  kb.classList.toggle('nolabels', labelMode===2);
  document.getElementById('lab').textContent = ['C D E','Do Re Mi','No labels'][labelMode];
  document.getElementById('oct').textContent = 'C'+(4+shift);
}
// ---------- audio ----------
const SF = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/';   // CC BY 3.0
const SOUNDS = [
  {id:'grand',  name:'Grand Piano',    sub:'Concert grand', gm:'acoustic_grand_piano', rel:0.3},
  {id:'old',    name:'Old Piano',      sub:'Honky-tonk upright', gm:'honkytonk_piano', rel:0.25, vintage:true},
  {id:'epiano', name:'Electric Piano', sub:'Rhodes-style', gm:'electric_piano_1', rel:0.3},
  {id:'church', name:'Church Organ',   sub:'Pipe organ', gm:'church_organ', loop:true, rel:0.18},
  {id:'jazz',   name:'Jazz Organ',     sub:'Hammond drawbars', gm:'drawbar_organ', loop:true, rel:0.06},
  {id:'harpsi', name:'Harpsichord',    sub:'Baroque', gm:'harpsichord', rel:0.12},
  {id:'mbox',   name:'Music Box',      sub:'Tinkly', gm:'music_box', rel:0.8},
  {id:'strings',name:'Strings',        sub:'Ensemble', gm:'string_ensemble_1', loop:true, rel:0.4},
  {id:'synth',  name:'Classic Synth',  sub:'Built-in, offline', gm:null}
];
const FL = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const LO = 48, HI = 96, STEP = 3;   // C3..C7, one sample every 3 semitones (≤1.5 st shift)
const MAXV = 24;
let ctx, master, comp, wet, dry, conv;
let soundId = (()=>{ try{ const v=localStorage.getItem('piano.sound'); return SOUNDS.some(x=>x.id===v)?v:'grand'; }catch(e){ return 'grand'; } })();
let reverbOn = (()=>{ try{ return localStorage.getItem('piano.reverb')==='1'; }catch(e){ return false; } })();
const banks = {};                  // id -> {state:'loading'|'ready'|'failed', buf:Map(midi->AudioBuffer)}
function audio(){
  if (!ctx){
    ctx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    comp = ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    master = ctx.createGain(); master.gain.value = vol.value;
    dry = ctx.createGain(); wet = ctx.createGain(); conv = ctx.createConvolver();
    conv.buffer = impulse(ctx, 2.2); wet.gain.value = reverbOn ? 0.28 : 0;
    master.connect(dry).connect(comp); master.connect(conv).connect(wet).connect(comp);
    comp.connect(ctx.destination);
    loadSound(soundId);
  }
  if (ctx.state !== 'running') ctx.resume();
  return ctx;
}
function impulse(c, sec){
  const n = c.sampleRate*sec|0, b = c.createBuffer(2, n, c.sampleRate);
  for (let ch=0; ch<2; ch++){ const d=b.getChannelData(ch); for (let k=0;k<n;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/n,3.2); }
  return b;
}
const cur = ()=>SOUNDS.find(x=>x.id===soundId);
function decode(ab){ return new Promise((res,rej)=>{ const p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); }); }
async function fetchBuf(url){
  const ac = window.AbortController ? new AbortController() : null;
  const to = setTimeout(()=>ac && ac.abort(), 12000);
  try { const r = await fetch(url, ac ? {signal:ac.signal} : {}); if (!r.ok) throw new Error('HTTP '+r.status); return await decode(await r.arrayBuffer()); }
  finally { clearTimeout(to); }
}
function loadSound(id){
  const sd = SOUNDS.find(x=>x.id===id);
  if (!sd || !sd.gm || !ctx || banks[id]) { status(); return; }
  const bank = banks[id] = {state:'loading', buf:new Map()};
  status();
  const jobs = [];
  for (let m=LO; m<=HI; m+=STEP){
    const url = SF + sd.gm + '-mp3/' + FL[m%12] + (Math.floor(m/12)-1) + '.mp3';
    jobs.push(fetchBuf(url).then(b=>bank.buf.set(m,b), ()=>{}));
  }
  Promise.all(jobs).then(()=>{ bank.state = bank.buf.size >= 3 ? 'ready' : 'failed'; if (bank.state==='failed') delete banks[id].buf; status(); });
}
function status(){
  const b = banks[soundId], sd = cur(), btn = $('sndBtn');
  const st = !sd.gm ? 'synth' : !b ? 'idle' : b.state;
  btn.textContent = (sd.loop ? '🎛 ' : '🎹 ') + sd.name.replace(' Piano','').replace(' Organ',' Org.');
  btn.classList.toggle('loading', st==='loading');
  btn.dataset.state = st;
  $('sndStat').textContent = st==='loading' ? 'Loading samples…' : st==='failed' ? 'Offline — using built-in synth' : st==='ready' ? 'Real samples loaded' : st==='synth' ? 'Built-in synth' : '';
  window.__sound = {id:soundId, state:st, reverb:reverbOn};
}
const voices = new Map();       // key idx -> voice
const held = new Set();         // key idx physically held
const tails = [];               // released voices still ringing (for polyphony cap)
function noteOn(i, vel=0.9){
  const c = audio();
  if (voices.has(i)) release(i, 0.03);
  const midi = BASE+shift*12+i;
  const sd = cur(), b = banks[soundId];
  const v = (sd.gm && b && b.state==='ready') ? sampleVoice(c, midi, vel, sd, b) : synthVoice(c, midi, vel);
  voices.set(i, v);
  const live = tails.filter(x=>x.end > c.currentTime); tails.length=0; tails.push(...live);
  while (voices.size + tails.length > MAXV && tails.length) tails.shift().kill();
  keys[i]?.classList.add('down');
  window.__notes && window.__notes.push(NAMES[midi%12]+(Math.floor(midi/12)-1));
}
function sampleVoice(c, midi, vel, sd, b){
  let best = null, bd = 99;
  for (const m of b.buf.keys()){ const d = Math.abs(m-midi); if (d<bd){ bd=d; best=m; } }
  const buf = b.buf.get(best), rate = Math.pow(2,(midi-best)/12), t = c.currentTime;
  const out = c.createGain(), srcs = [];
  const peak = 0.75*vel;
  out.gain.setValueAtTime(0.0001, t);
  out.gain.linearRampToValueAtTime(peak, t + (sd.loop ? 0.012 : 0.003));
  let node = out;
  if (sd.vintage){       // old upright: duller top end + a slightly out-of-tune second string
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4200; lp.Q.value=0.5;
    lp.connect(out); node = lp;
  }
  const mk = (det, g)=>{
    const s = c.createBufferSource(); s.buffer = buf; s.playbackRate.value = rate; s.detune.value = det;
    if (sd.loop){ s.loop = true; s.loopStart = Math.min(0.5, buf.duration*0.25); s.loopEnd = Math.max(s.loopStart+0.2, buf.duration-0.35); }
    const gg = c.createGain(); gg.gain.value = g; s.connect(gg).connect(node); s.start(t); srcs.push(s);
  };
  mk(0, 1);
  if (sd.vintage){
    mk(9 + Math.random()*4, 0.35);
    const n = c.createBufferSource(), ng = c.createGain(), nf = c.createBiquadFilter();
    n.buffer = noiseBuf(c); nf.type='bandpass'; nf.frequency.value=2500; ng.gain.value=0.025*vel;
    n.connect(nf).connect(ng).connect(out); n.start(t); srcs.push(n);
  }
  out.connect(master);
  const end = t + (sd.loop ? 1e9 : buf.duration/rate + 0.05);
  if (!sd.loop) srcs.forEach(s=>{ try{s.stop(end)}catch(e){} });
  return {out, srcs, rel:sd.rel, end};
}
let _nb;
function noiseBuf(c){ if (_nb) return _nb; const n=c.sampleRate*0.05|0; _nb=c.createBuffer(1,n,c.sampleRate); const d=_nb.getChannelData(0); for(let k=0;k<n;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/n,4); return _nb; }
function synthVoice(c, midi, vel){
  const t = c.currentTime, f = 440*Math.pow(2,(midi-69)/12);
  const out = c.createGain(), lp = c.createBiquadFilter();
  lp.type='lowpass'; lp.Q.value=0.7;
  lp.frequency.setValueAtTime(Math.min(16000, f*10), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(600, f*2.5), t+1.6);
  const decay = 1.2 + 5*Math.pow(0.97, midi-48);   // low notes ring longer
  const peak = 0.32*vel;
  out.gain.setValueAtTime(0.0001, t);
  out.gain.linearRampToValueAtTime(peak, t+0.004);
  out.gain.exponentialRampToValueAtTime(peak*0.45, t+0.25);
  out.gain.exponentialRampToValueAtTime(0.0001, t+decay);
  const parts = [[1,1,0],[1,0.5,6],[2,0.38,-4],[3,0.16,3],[4,0.1,-2],[5,0.05,4],[6,0.03,0]];
  const srcs = [];
  for (const [h,a,det] of parts){
    if (f*h > 18000) continue;
    const o = c.createOscillator(), g = c.createGain();
    o.type = h===1 ? 'triangle' : 'sine';

    parts.push(`<ellipse cx="${hx}" cy="${hy}" rx="4.3" ry="3.1" transform="rotate(-22 ${hx} ${hy})" fill="${open?'none':'currentColor'}" stroke="currentColor" stroke-width="${open?1.6:1}"/>`);
    if (n.dot) parts.push(`<circle cx="${hx+8}" cy="${hy-(n.pos%2===0?2:0)}" r="1.5" fill="currentColor"/>`);
    if (n.g!=='w') parts.push(`<line x1="${sx}" x2="${sx}" y1="${hy}" y2="${se}" stroke="currentColor" stroke-width="1.2"/>`);
    if (n.flag && !n.beam){ const f = c=>n.up ? `<path d="M${sx} ${se+c}c1 4 7 6 5 13 0-5-3-7-5-8" fill="currentColor"/>` : `<path d="M${sx} ${se-c}c1-4 7-6 5-13 0 5-3 7-5 8" fill="currentColor"/>`;
      parts.push(f(0)); if (n.g==='s') parts.push(f(n.up?5:5)); }
    out.push(`<g class="n" data-k="${n.k}">${parts.join('')}</g>`);
  }
  for (const b of beams){ const a=b[0], z=b[b.length-1], up=a.up, sx=n=>n.x+(up?4:-4), y=yOf(a.stemEnd), d=up?0:-3.5;
    out.push(`<path class="bm" data-k="${a.k}" d="M${sx(a)} ${y+d}H${sx(z)}v3.5H${sx(a)}z"/>`);
    const yy = y + (up?5.5:-9);
    for (let i=0;i<b.length;i++) if (b[i].g==='s'){ const n=b[i], nb=b[i+1], x1=sx(n), x2 = nb && nb.g==='s' ? sx(nb) : (nb ? x1+6 : x1-6);
      if (b[i-1]?.g==='s' && !(nb && nb.g==='s')) continue;
      out.push(`<path class="bm" data-k="${n.k}" d="M${Math.min(x1,x2)} ${yy}H${Math.max(x1,x2)}v3H${Math.min(x1,x2)}z"/>`); } }
  const W = x+40, lines=[0,2,4,6,8].map(l=>`<line class="ln" x1="4" x2="${W-4}" y1="${yOf(l)}" y2="${yOf(l)}"/>`).join('');
  const ts = `<text x="38" y="${yOf(6)+1}" font-size="17" font-weight="800" fill="#1f1f1f" font-family="serif">${meter}</text><text x="38" y="${yOf(2)+1}" font-size="17" font-weight="800" fill="#1f1f1f" font-family="serif">4</text>`;
  staffEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" viewBox="0 0 ${W} 74" preserveAspectRatio="xMinYMid meet">${lines}<path d="${CLEF}" transform="translate(4 -8) scale(.95)" fill="#1f1f1f"/>${ts}<line class="ln" x1="${W-8}" x2="${W-8}" y1="${yOf(8)}" y2="${Y0}" stroke-width="3"/>${out.join('')}</svg>`;
  staffEl.classList.add('has'); staffEl._els = [...staffEl.querySelectorAll('.n')]; staffEl._last=-2;
}
function markStaff(p, force){
  if (!staffEl._els || !L.song) return;
  if (p===staffEl._last && !force) return; staffEl._last=p;
  staffEl._els.forEach((g,i)=>{ g.classList.toggle('played', i<p); g.classList.toggle('cur', i===p); g.classList.toggle('nxt', i===p+1); });
  staffEl.querySelectorAll('.bm').forEach(b=>b.classList.toggle('played', +b.dataset.k < p));
  if (!staffOn) return;
  const n = staffNotes[Math.min(p, staffNotes.length-1)]; if (!n) return;
  const sc = (staffEl.clientHeight||74)/74, want = Math.max(0, n.x*sc - staffEl.clientWidth*0.3);
  if (Math.abs(staffEl.scrollLeft-want) > 4) { if (staffEl.scrollTo) staffEl.scrollTo({ left: want, behavior: force ? 'auto' : 'smooth' }); else staffEl.scrollLeft = want; }
}
function jumpTo(k){
  if (!L.song || k<0 || k>=L.steps.length) return;
  if (L.demo) stopDemo(false); clearTimeout(L.timer); L.timer=null; allOff(); hideDone();
  if (L.state==='done' || L.state==='listening') L.state='ready';
  L.pos=k; L.needShift=true; render(); pulseNext(); if (L.follow && L.state==='playing') scheduleFollow();
}
staffEl.addEventListener('click', e=>{ const g=e.target.closest('.n'); if (g) jumpTo(+g.dataset.k); });
setStaff(staffOn);
window.__piano={jumpTo,setStaff,startSong,keyDown,keyUp,L,songs:SONGS,play,pause,stop,listen,restart,exitSong};
const _labels = labels; labels = function(){ _labels(); if(L && L.song) render(); };
$('rotgo').onclick=()=>document.body.classList.add('portraitok');
build();
})();
</script>
