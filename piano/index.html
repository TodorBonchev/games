@media (orientation:portrait) and (max-width:820px){#rot{display:flex}body.portraitok #rot{display:none}
 #lbar{height:auto;flex-wrap:wrap;padding:4px 8px}#ltitle{max-width:100%;flex-basis:100%}#vol{display:none}}

#lbar button:disabled{opacity:.4}
#bar button.hint{background:#39d0ff;color:#111;animation:glow .7s infinite alternate}@keyframes glow{from{box-shadow:0 0 0 #39d0ff}to{box-shadow:0 0 14px #39d0ff}}

@media (max-height:340px){#bar{height:36px}#lbar{height:30px}#lbar button{height:24px;padding:0 7px}#lstep{min-width:60px}}

<body>
<div id="app">
 <div id="bar">
  <a href="../" aria-label="Back to games">←</a>
  <button id="lab">C D E</button>
  <button id="od" aria-label="Octave down">−</button><span id="oct">C4</span><button id="ou" aria-label="Octave up">+</button>
  <button id="sus">Sustain</button>
  <button id="songsBtn">♪ Songs</button>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  <span class="sp"></span>
  <button id="fs" aria-label="Fullscreen" hidden>⛶</button>
 </div>
 <div id="lbar"><span id="ltitle"></span><div id="lprog"><i></i></div><span id="lstep"></span>
  <span id="lstate" data-state="ready">Ready</span>
  <button id="lplay">▶ Start</button><button id="lstop" aria-label="Stop">■</button>
  <button id="lmode" title="Wait: the song waits for you. Tempo: it moves on in time">Wait</button><button id="ldemo">♪ Listen</button><button id="lrestart" aria-label="Restart">↺</button><button id="lexit" aria-label="Exit song">✕</button></div>
 <div id="kb"></div>
</div>
<div id="sheet"><div class="panel"><h2>Learn a song <input id="songq" type="search" placeholder="Search songs…" autocomplete="off" aria-label="Search songs"> <button id="sheetX" aria-label="Close">✕</button></h2><div id="songlist"></div></div></div>
<div id="done"><div class="panel"><div class="big">🎉 Well done!</div><div id="dtitle"></div><div id="dstats"></div>
 <div class="row"><button id="dagain">↻ Play again</button><button id="dsongs">♪ Songs</button><button id="dclose">Close</button></div></div></div>
<div id="rot"><div>📱</div>Rotate your phone to play<button id="rotgo">Play in portrait</button></div>
<script src="songs.js?v3"></script>
<script>
(() => {
const kb = document.getElementById('kb');
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SOLF = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const BASE = 60;                // C4
const COUNT = 25;               // C4..C6
let shift = 0, labelMode = 0, sustain = false;
const keys = [];                // {el, idx}
// ---------- layout ----------
const whites = []; for (let i=0;i<COUNT;i++) if (![1,3,6,8,10].includes(i%12)) whites.push(i);
function build(){
  kb.innerHTML=''; keys.length=0;
  const ww = 100/whites.length;
  let wi = 0;
  for (let i=0;i<COUNT;i++){
    const black = [1,3,6,8,10].includes(i%12);
    const el = document.createElement('div');
    el.className = 'k ' + (black?'b':'w');
    el.dataset.i = i;
    if (black){ el.style.left = (wi*ww - ww*0.31)+'%'; el.style.width = (ww*0.62)+'%'; }
    else { el.style.left = (wi*ww)+'%'; el.style.width = ww+'%'; wi++; }
    el.appendChild(document.createElement('span'));
    kb.appendChild(el); keys[i]=el;
  }
  labels();
}
function labels(){
  keys.forEach((el,i)=>{
    const m = BASE+shift*12+i, n = m%12, o = Math.floor(m/12)-1;
    el.firstChild.textContent = labelMode===1 ? SOLF[n] : NAMES[n]+o;
  });
  kb.classList.toggle('nolabels', labelMode===2);
  document.getElementById('lab').textContent = ['C D E','Do Re Mi','No labels'][labelMode];
  document.getElementById('oct').textContent = 'C'+(4+shift);
}
// ---------- audio ----------
let ctx, master, comp;
function audio(){
  if (!ctx){
    ctx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    comp = ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    master = ctx.createGain(); master.gain.value = vol.value;
    master.connect(comp).connect(ctx.destination);
  }
  if (ctx.state !== 'running') ctx.resume();
  return ctx;
}
const voices = new Map();       // key idx -> voice
const held = new Set();         // key idx physically held
function noteOn(i, vel=0.9){
  const c = audio(), t = c.currentTime;
  if (voices.has(i)) release(i, 0.03);
  const midi = BASE+shift*12+i, f = 440*Math.pow(2,(midi-69)/12);
  const out = c.createGain(), lp = c.createBiquadFilter();
  lp.type='lowpass'; lp.Q.value=0.7;
  lp.frequency.setValueAtTime(Math.min(16000, f*10), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(600, f*2.5), t+1.6);
  const decay = 1.2 + 5*Math.pow(0.97, midi-48);   // low notes ring longer
  const peak = 0.32*vel;
  out.gain.setValueAtTime(0.0001, t);
  out.gain.linearRampToValueAtTime(peak, t+0.004);
  out.gain.exponentialRampToValueAtTime(peak*0.45, t+0.25);
  out.gain.exponentialRampToValueAtTime(0.0001, t+decay);
  const parts = [[1,1,0],[1,0.5,6],[2,0.38,-4],[3,0.16,3],[4,0.1,-2],[5,0.05,4],[6,0.03,0]];
  const oscs = [];
  for (const [h,a,det] of parts){
    if (f*h > 18000) continue;
    const o = c.createOscillator(), g = c.createGain();
    o.type = h===1 ? 'triangle' : 'sine';
    o.frequency.value = f*h*(1+0.0004*h*h);  // slight inharmonicity
    o.detune.value = det;
    g.gain.setValueAtTime(a, t);
    g.gain.exponentialRampToValueAtTime(a*0.2+0.0001, t+decay*0.6/h);
    o.connect(g).connect(lp); o.start(t); o.stop(t+decay+0.1); oscs.push(o);
  }
  // hammer click
  const nb = c.createBuffer(1, c.sampleRate*0.03|0, c.sampleRate), d = nb.getChannelData(0);
  for (let k=0;k<d.length;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,3);
  const ns = c.createBufferSource(), ng = c.createGain(), nf = c.createBiquadFilter();
  ns.buffer=nb; nf.type='bandpass'; nf.frequency.value=Math.min(8000,f*4); ng.gain.value=0.06*vel;
  ns.connect(nf).connect(ng).connect(out); ns.start(t);
  lp.connect(out).connect(master);
  voices.set(i, {out, oscs});
  keys[i]?.classList.add('down');
  window.__notes && window.__notes.push(NAMES[midi%12]+(Math.floor(midi/12)-1));
}
function release(i, time=0.35){
  const v = voices.get(i); if (!v) return;
  const t = ctx.currentTime;
  v.out.gain.cancelScheduledValues(t);
  v.out.gain.setTargetAtTime(0.0001, t, time/4);
  v.oscs.forEach(o=>{ try{o.stop(t+time+0.05)}catch(e){} });
  voices.delete(i);
}
function keyDown(i){ held.add(i); noteOn(i); learnHit(i); }
function keyUp(i){ held.delete(i); keys[i]?.classList.remove('down'); if (!sustain) release(i); }
// ---------- pointers (multi-touch + glissando) ----------
const ptr = new Map();          // pointerId -> key idx
function keyAt(x,y){
  const el = document.elementFromPoint(x,y);
  const k = el && el.closest && el.closest('.k');
  return k ? +k.dataset.i : -1;
}
kb.addEventListener('pointerdown', e=>{
  e.preventDefault(); audio();
  try{ kb.releasePointerCapture?.(e.pointerId) }catch(_){}
  const i = keyAt(e.clientX,e.clientY); ptr.set(e.pointerId,i);
  if (i>=0) keyDown(i);
});
kb.addEventListener('pointermove', e=>{
  if (!ptr.has(e.pointerId)) return;
  const i = keyAt(e.clientX,e.clientY), prev = ptr.get(e.pointerId);
  if (i===prev) return;
  ptr.set(e.pointerId,i);
  if (prev>=0 && ![...ptr.values()].includes(prev)) keyUp(prev);
  if (i>=0) keyDown(i);
});
function up(e){
  if (!ptr.has(e.pointerId)) return;
  const prev = ptr.get(e.pointerId); ptr.delete(e.pointerId);
  if (prev>=0 && ![...ptr.values()].includes(prev)) keyUp(prev);
}
['pointerup','pointercancel','pointerleave'].forEach(t=>kb.addEventListener(t,up));
// block gestures / menus
['touchstart','touchmove','gesturestart','dblclick'].forEach(t=>document.addEventListener(t,e=>{ if(!e.target.closest("button,a,input,#sheet .panel")) e.preventDefault(); },{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
// unlock on first touch (iOS)
const unlock = ()=>{ audio(); const b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0); };
['touchend','pointerdown','keydown'].forEach(t=>document.addEventListener(t,unlock,{once:true,capture:true}));
// ---------- controls ----------
const $ = id=>document.getElementById(id);
const vol = $('vol');
vol.addEventListener('input',()=>{ if(master) master.gain.value = vol.value; });
$('lab').onclick = ()=>{ labelMode=(labelMode+1)%3; labels(); };
$('od').onclick = ()=>{ if(shift>-3){ shift--; labels(); } };
$('ou').onclick = ()=>{ if(shift<2){ shift++; labels(); } };
$('sus').onclick = ()=>{ sustain=!sustain; $('sus').classList.toggle('on',sustain);
  if(!sustain) [...voices.keys()].forEach(i=>{ if(!held.has(i)) release(i); }); };
const fsb = $('fs'), root = document.documentElement;
if ((root.requestFullscreen || root.webkitRequestFullscreen) && !/iPhone|iPad|iPod/.test(navigator.userAgent)) {
  fsb.hidden = false;
  fsb.onclick = ()=>{ if (document.fullscreenElement) document.exitFullscreen();
    else (root.requestFullscreen||root.webkitRequestFullscreen).call(root).then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{}); };
}
// ---------- desktop keyboard ----------
const MAP = 'zsxdcvgbhnjmq2w3er5t6y7ui';   // 25 keys C4..C6
const kdown = new Set();
addEventListener('keydown', e=>{
  if (e.repeat || e.ctrlKey || e.metaKey || e.target.closest?.('input')) return;
  if (e.key===' '){ e.preventDefault(); $('sus').click(); return; }
  if (e.key==='ArrowLeft') return $('od').click();
  if (e.key==='ArrowRight') return $('ou').click();
  const i = MAP.indexOf(e.key.toLowerCase());
  if (i>=0 && !kdown.has(i)){ kdown.add(i); keyDown(i); }
});
addEventListener('keyup', e=>{
  const i = MAP.indexOf(e.key.toLowerCase());
  if (i>=0 && kdown.has(i)){ kdown.delete(i); keyUp(i); }
});
addEventListener('blur', ()=>{ [...held].forEach(keyUp); kdown.clear(); ptr.clear(); });
// ---------- learn mode ----------
const SONGS = window.PIANO_SONGS || [];
const toMidi = s => { const m = /^([A-G])(#|b)?(\d)$/.exec(s); return (m[3]*1+1)*12 + [0,2,4,5,7,9,11]['CDEFGAB'.indexOf(m[1])] + (m[2]==='#'?1:m[2]==='b'?-1:0); };
// state: 'ready' (waiting to start/first key) | 'playing' | 'paused' | 'listening' | 'done'
const L = { song:null, steps:[], pos:0, follow:false, state:'ready', demo:null, demoNotes:new Set(), timer:null, resumePos:0, hits:0, misses:0, autoShift:true };
window.__learn = L;
const sheet = $('sheet'), list = $('songlist');
const CATS = window.PIANO_CATEGORIES || [];
function renderList(q=''){
  q=q.trim().toLowerCase(); list.innerHTML='';
  const match = sg => !q || (sg.title+' '+(sg.subtitle||'')+' '+sg.category+' '+sg.level).toLowerCase().includes(q);
  const cats = [...CATS, ...new Set(SONGS.map(s=>s.category).filter(c=>!CATS.includes(c)))];
  let shown=0;
  for (const cat of cats){
    const items = SONGS.filter(sg=>sg.category===cat && match(sg)); if(!items.length) continue;
    const h=document.createElement('h3'); h.textContent=cat; list.appendChild(h);
    for (const sg of items){ shown++;
      const b=document.createElement('button'); b.className='song'+(sg.featured?' feat':''); b.dataset.id=sg.id;
      b.innerHTML=`<b></b>${sg.featured?'<em>FIRST</em>':''}<i class="lvl ${sg.level}">${sg.level}</i>`;
      b.firstChild.textContent=sg.title; const sm=document.createElement('small'); sm.textContent=sg.subtitle||''; b.firstChild.appendChild(sm);
      b.onclick=()=>{ sheet.classList.remove('show'); startSong(sg); }; list.appendChild(b); }
  }
  if(!shown) list.innerHTML='<p class="none">No songs match.</p>';
}
renderList();
$('songq').addEventListener('input',e=>renderList(e.target.value));
$('songsBtn').onclick=()=>{ if(L.state==='playing' && L.follow) pause(); sheet.classList.add('show'); };
$('sheetX').onclick=()=>sheet.classList.remove('show');
sheet.addEventListener('pointerdown',e=>{ if(e.target===sheet) sheet.classList.remove('show'); });
const spb = ()=>60000/(L.song?.tempo||100);
function startSong(sg){
  stopDemo(false); clearTimeout(L.timer); allOff(); L.song=sg;
  let ms = sg.notes.filter(x=>!x.rest).map(x=>toMidi(x.note));
  let t = 0; const lo=Math.min(...ms), hi=Math.max(...ms);
  if (hi-lo<=24){ while(lo+t<36) t+=12; while(hi+t>96) t-=12; }
  let sh = Math.max(-3,Math.min(2,Math.floor((lo+t-BASE)/12)));
  if (hi+t > BASE+sh*12+COUNT-1) sh = Math.min(2, Math.ceil((hi+t-BASE-COUNT+1)/12));
  shift = sh; _labels();
  L.steps=[]; let beat=0;
  sg.notes.forEach(x=>{ if(!x.rest) L.steps.push({midi:toMidi(x.note)+t, beat, dur:x.dur}); beat+=x.dur; });
  L.total = beat;
  $('ltitle').textContent=sg.title; $('lbar').classList.add('show'); $('songsBtn').classList.add('on');
  restart();
}
function setState(s){ L.state=s; render(); }
function restart(){ stopDemo(false); clearTimeout(L.timer); allOff(); L.pos=0; L.needShift=true; L.hits=0; L.misses=0; hideDone(); setState('ready'); pulseNext(); }
function exitSong(){ stopDemo(false); clearTimeout(L.timer); allOff(); hideDone(); L.song=null; L.steps=[]; L.pos=0; L.state='ready'; clearMarks(); $('lbar').classList.remove('show'); $('songsBtn').classList.remove('on'); hint(0); }
function clearMarks(){ keys.forEach(k=>k.classList.remove('next','after')); }
const keyOf = midi => midi-(BASE+shift*12);
const nm = midi => NAMES[midi%12]+(Math.floor(midi/12)-1);
// keep the target key on screen: auto-shift the octave view (or show a hint arrow when that's impossible)
function ensureVisible(midi){
  let i=keyOf(midi); if (i>=0 && i<COUNT) return true;
  if (!L.autoShift || !L.needShift) return false;
  const want = Math.floor((midi-BASE)/12) - (i<0?0:1);
  const sh = Math.max(-3,Math.min(2,want));
  if (sh!==shift){ shift=sh; _labels(); }
  i=keyOf(midi); return i>=0 && i<COUNT;
}
function hint(dir){ $('od').classList.toggle('hint',dir<0); $('ou').classList.toggle('hint',dir>0); }
const LABEL = {ready:'Ready', playing:'Playing', paused:'Paused', listening:'Listening', done:'Done'};
function render(){
  if (!L.song) return;
  clearMarks(); const n=L.steps.length, st=L.steps[L.pos];
  const p = L.state==='listening' ? L.demoPos : L.pos;
  $('lprog').firstChild.style.width=(100*Math.min(p,n)/n)+'%';
  $('lstate').textContent = L.state==='ready' ? (L.follow?'Ready':'Play the blue key') : LABEL[L.state];
  $('lstate').dataset.state = L.state;
  $('lplay').textContent = L.state==='playing' ? '❚❚ Pause' : (L.state==='paused' ? '▶ Resume' : (L.state==='done' ? '↻ Again' : '▶ Start'));
  $('lplay').disabled = L.state==='listening';
  $('lstop').disabled = L.state==='ready' && L.pos===0;
  $('ldemo').textContent = L.state==='listening' ? '■ Stop' : '♪ Listen';
  $('lmode').textContent = L.follow?'Tempo':'Wait';
  $('lmode').classList.toggle('on',L.follow);
  document.body.dataset.learn = L.state;
  if (L.state==='listening'){ hint(0); $('lstep').textContent=`${Math.min(L.demoPos+1,n)}/${n}`; return; }
  if (!st){ hint(0); $('lstep').textContent='Done! 🎉 '+n+'/'+n; return; }
  const vis = ensureVisible(st.midi), i = keyOf(st.midi); L.needShift=false;
  hint(vis?0:(i<0?-1:1));
  let rep=0; for(let k=L.pos+1;k<n && L.steps[k].midi===st.midi;k++) rep++;
  $('lstep').textContent=`${nm(st.midi)}${rep?' ×'+(rep+1):''} • ${L.pos+1}/${n}`;
  const nx=L.steps[L.pos+1];
  if (nx && nx.midi!==st.midi) keys[keyOf(nx.midi)]?.classList.add('after');
  keys[i]?.classList.add('next');
}
function pulseNext(){ const st=L.steps[L.pos]; const el=st && keys[keyOf(st.midi)]; if(el){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); } }
function learnHit(i){
  if (!L.song || L.state==='listening' || L.state==='done' || L.state==='paused' || L.pos>=L.steps.length) return;
  const midi=BASE+shift*12+i, st=L.steps[L.pos];
  if (midi===st.midi){
    if (L.state==='ready') L.state='playing';
    L.hits++; advance();
  } else { L.misses++; const el=keys[i]; el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong'); clearTimeout(el._wt); el._wt=setTimeout(()=>el.classList.remove('wrong'),220); }
}
function advance(){
  L.pos++; L.needShift=true;
  if (L.pos>=L.steps.length){ clearTimeout(L.timer); setState('done'); showDone(); return; }
  render(); pulseNext(); if (L.follow && L.state==='playing') scheduleFollow();
}
// Tempo mode: the cursor moves on by itself if the player doesn't hit the note in time
function scheduleFollow(){
  clearTimeout(L.timer); L.timer=null;
  if (!L.follow || L.state!=='playing' || L.pos>=L.steps.length) return;
  const st=L.steps[L.pos], nx=L.steps[L.pos+1];
  const gap=((nx?nx.beat:st.beat+st.dur)-st.beat)*spb();
  L.timer=setTimeout(()=>{ L.timer=null; if(L.state==='playing' && L.follow){ L.misses++; advance(); } }, gap*1.15+150);
}
function play(){
  if (!L.song) return;
  if (L.state==='done'){ restart(); }
  if (L.state==='listening') return;
  audio(); hideDone(); setState('playing'); pulseNext(); scheduleFollow();
}
function pause(){ if (L.state!=='playing') return; clearTimeout(L.timer); L.timer=null; setState('paused'); }
function stop(){ restart(); }
// ---- Listen: plays from the current position, returns to it when stopped or finished ----
function allOff(){ for (const i of [...voices.keys()]) if(!held.has(i)) release(i,0.08); keys.forEach((k,i)=>{ if(!held.has(i)) k.classList.remove('down'); }); }
function releaseAllKeys(){ [...held].forEach(keyUp); ptr.clear(); kdown.clear(); }
function stopDemo(restore=true){
  if (!L.demo) return;
  L.demo.forEach(clearTimeout); L.demo=null;
  for (const i of L.demoNotes){ keys[i]?.classList.remove('down'); if(!held.has(i)) release(i,0.08); } L.demoNotes.clear();
  L.state = L.prevState==='done' ? 'ready' : (L.prevState==='playing' && L.follow ? 'paused' : (L.prevState==='playing'?'playing':L.prevState||'ready'));
  if (restore){ L.pos = L.resumePos; L.needShift=true; render(); pulseNext(); }
}
function listen(){
  if (!L.song) return;
  if (L.demo){ stopDemo(); return; }
  audio(); clearTimeout(L.timer); L.timer=null; hideDone();
  L.prevState=L.state; L.resumePos = L.state==='done'?0:L.pos;
  const from = L.resumePos, s0 = L.steps[from].beat, ms=spb();
  L.demo=[]; L.demoPos=from; L.state='listening'; render();
  for (let k=from;k<L.steps.length;k++){ const st=L.steps[k];
    L.demo.push(setTimeout(()=>{
      L.demoPos=k; L.needShift=true; ensureVisible(st.midi); L.needShift=false; render(); const i=keyOf(st.midi); if(!keys[i]) return;
      clearMarks(); keys[i].classList.add('next');
      noteOn(i,0.8); L.demoNotes.add(i);
      L.demo && L.demo.push(setTimeout(()=>{ if(!L.demoNotes.has(i)) return; L.demoNotes.delete(i); keys[i].classList.remove('down'); if(!held.has(i) && !sustain) release(i); }, Math.max(90, st.dur*ms*0.9)));
    }, (st.beat-s0)*ms+80));
  }
  const last=L.steps[L.steps.length-1];
  L.demo.push(setTimeout(()=>{ stopDemo(); window.__demoDone=true; }, (last.beat+last.dur-s0)*ms+300));
}
function showDone(){
  const n=L.steps.length, acc=Math.round(100*L.hits/Math.max(1,L.hits+L.misses));
  $('dtitle').textContent=L.song.title; $('dstats').textContent=`${n} notes • ${L.misses} miss${L.misses===1?'':'es'} • ${acc}% accuracy`;
  $('done').classList.add('show');
}
function hideDone(){ $('done').classList.remove('show'); }
$('dagain').onclick=()=>{ restart(); if(L.follow) play(); };
$('dsongs').onclick=()=>{ hideDone(); sheet.classList.add('show'); };
$('dclose').onclick=hideDone;
$('ldemo').onclick=listen;
$('lplay').onclick=()=>{ L.state==='playing' ? pause() : play(); };
$('lstop').onclick=stop;
$('lrestart').onclick=()=>{ const go=L.state==='playing'; restart(); if(go) play(); };
$('lexit').onclick=exitSong;
$('lmode').onclick=()=>{ if(L.state==='listening') return; L.follow=!L.follow; clearTimeout(L.timer); L.timer=null;
  if (L.state==='playing') scheduleFollow(); render(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(L.demo) stopDemo(); pause(); releaseAllKeys(); allOff(); } });
window.__piano={startSong,keyDown,keyUp,L,songs:SONGS,play,pause,stop,listen,restart,exitSong};
const _labels = labels; labels = function(){ _labels(); if(L && L.song) render(); };
$('rotgo').onclick=()=>document.body.classList.add('portraitok');
build();
})();
</script>
</body>
