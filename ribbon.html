<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063d53"><meta name="description" content="Glide a little manta through five colorful coral currents. Collect pearls with your ribbon wake and find your flow with one finger."><title>Ribbon Reef · Games</title><link rel="icon" href="assets/games-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./ribbon.css"></head><body>
<main class="app"><header class="top"><a href="./" class="home" aria-label="Back to all games">← <span>ALL GAMES</span></a><div class="brand"><span>✦</span> RIBBON REEF</div><div class="top-actions"><button id="helpButton" aria-label="How to play">?</button><button id="pauseButton" aria-label="Pause game">Ⅱ</button></div></header>
<section class="game-layout"><div class="left"><div class="route-label">CURRENT <span id="levelLabel">01 / 05</span></div><h1 id="levelName">Sunlit shallows</h1><div class="progress"><span id="progressFill"></span></div><div class="progress-text"><span>THE OPEN SEA</span><span>THE REEF ✦</span></div><p class="intro-copy">A little ray.<br>A long, lovely wake.</p></div>
<div class="stage-wrap"><div id="gameStage" tabindex="0" aria-label="Game area. Drag one finger to steer the ray. Use arrow keys to steer with a keyboard."></div><div class="stage-label" aria-hidden="true"><span>✧</span> FOLLOW THE LIGHT</div><div id="toast" role="status" aria-live="polite" hidden></div></div>
<aside class="right"><div class="stat"><span>PEARLS</span><strong id="pearls">0</strong><small>COLLECTED BY YOUR WAKE</small></div><div class="stat"><span>RESONANCE</span><strong id="combo">0×</strong><small>PERFECT ARCH CHAIN</small></div><div class="health"><span>HEARTS</span><strong id="health">♥ ♥ ♥ ♥ ♥</strong></div></aside></section>
<footer class="bottom"><div class="gesture" aria-hidden="true">↗</div><div><b id="controlTitle">DRAG TO DANCE</b><span id="controlText">Slide one finger to guide your ray through the arches.</span></div><button id="levelsButton">ROUTES <span>⌄</span></button></footer></main>
<div id="modal" class="modal"><section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1"><div id="panelContent"></div></section></div><noscript><p class="noscript">JavaScript is needed to play Ribbon Reef. <a href="./">Return to all games</a>.</p></noscript><script type="module" src="./ribbon-main.js"></script></body></html>
