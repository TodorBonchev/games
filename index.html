<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Soldier vs Zombies</title>
<style>
html,body{height:100%;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;position:fixed;inset:0;overflow:hidden;background:#000;font-family:'Arial Black',Arial,sans-serif;color:#fff}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));font-size:20px;text-shadow:2px 2px 0 #0008}
#hpbar{width:220px;height:18px;border:3px solid #fff;border-radius:9px;margin-top:6px;overflow:hidden;background:#0006}#hp{height:100%;background:linear-gradient(#5f5,#2b2);width:100%}
#cross{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;display:none}
#cross:before,#cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 2px #000}#cross:before{left:12px;top:0;width:2px;height:26px}#cross:after{top:12px;left:0;height:2px;width:26px}
.playing #cross{display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#ff8a5c55,#6a3fd055);text-align:center;padding:10px}
.ov h1{font-size:clamp(28px,7vw,60px);margin:0;text-shadow:3px 3px 0 #0006}.ov p{font-family:Arial;font-size:16px}
button{font-family:inherit;font-size:30px;padding:18px 56px;border-radius:16px;border:4px solid #fff;background:#ffcc1a;color:#3a2a00;cursor:pointer;margin-top:14px}
.hide{display:none!important}
.tb{position:fixed;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:16px;color:#fff;border:3px solid #fffb;text-shadow:1px 1px 0 #000}
.touch.playing .tb{display:flex}
#fireBtn{width:100px;height:100px;right:calc(26px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));background:#e33a3acc}
#jumpBtn{width:70px;height:70px;right:calc(140px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));background:#2f7de1cc}
#stick{position:fixed;width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff8;display:none;pointer-events:none;left:calc(30px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom))}
#stick i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fff9}.touch.playing #stick,.touch.intro #stick{display:block}
#lock{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid #ff3030;border-radius:50%;box-shadow:0 0 6px #f00;pointer-events:none;display:none}
#skipBtn{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));font-size:22px;padding:10px 34px;margin:0;background:#fffc;color:#222;border:3px solid #ffcc1a}#ver{position:fixed;right:calc(8px + env(safe-area-inset-right));bottom:calc(4px + env(safe-area-inset-bottom));font:11px Arial;color:#fffa;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:5}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(40,10,30,.38) 100%)}
body:not(.touch) canvas{filter:saturate(1.08) contrast(1.05)}
canvas{position:relative;z-index:0}#vig{z-index:1}#hud,#cross,#lock,.tb,#stick,#ver{z-index:5}#skipBtn{z-index:15}.ov{z-index:20}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="hud">Score: <span id="score">0</span> &nbsp; Wave: <span id="wave">1</span><div id="hpbar"><div id="hp"></div></div></div>
<div id="vig"></div><div id="ver"></div><div id="cross"></div><div id="lock"></div><button id="skipBtn" class="hide">SKIP ▶</button><div id="stick"><i></i></div>
<div id="fireBtn" class="tb">FIRE</div><div id="jumpBtn" class="tb">JUMP</div>
<div id="start" class="ov"><h1>SOLDIER vs ZOMBIES</h1>
<p>📱 Left thumb: move · Drag right side: look · hold FIRE (auto-aim) · JUMP<br>🖥️ WASD move · Mouse look · Hold click: auto-aim shoot · Space jump · Esc frees mouse</p><button id="startBtn">PLAY</button></div>
<div id="over" class="ov hide"><h1>GAME OVER</h1><p id="final"></p><button id="restartBtn">PLAY AGAIN</button></div>
<script type="module" src="main.js?v9"></script></body></html>
