<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#163f35" />
  <meta name="description" content="Special delivery, one leap at a time. Slingshot a tiny frog courier between floating lily pads in five leafy adventures." />
  <title>Pond Post — Games</title>
  <link rel="icon" href="assets/games-icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preload" href="assets/fonts/barlow-condensed-800.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="pondpost.css?v1" />
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <div class="game-app">
    <header class="topbar">
      <a class="home-button" href="./" aria-label="Back to all games">←<span>games.</span></a>
      <a class="brand" href="./" aria-label="Pond Post, back to all games"><svg class="brand-mark" viewBox="0 0 28 24" aria-hidden="true"><path d="M3 5h22v15H3zM3 5l11 9L25 5"/></svg>pond post<span>.</span></a>
      <nav aria-label="Game options">
        <button class="icon-button" id="soundButton" aria-label="Turn sound on" aria-pressed="false"></button>
        <button class="icon-button" id="helpButton" aria-label="How to play">?</button>
        <button class="icon-button" id="pauseButton" aria-label="Pause game" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14m8-14v14"/></svg></button>
      </nav>
    </header>
    <main class="game-main">
      <section class="hud" id="hud" aria-label="Delivery status">
        <button class="route-button" id="levelButton" aria-label="Choose route"><span class="eyebrow">SPECIAL DELIVERY</span><strong id="levelLabel">01 <small>/ 05</small><span aria-hidden="true">⌄</span></strong></button>
        <div class="route-info"><strong id="levelName">A first-class hop</strong><span id="goalLabel">A LETTER TO THE TOP</span><div class="goal-track"><i id="goalFill"></i></div></div>
        <div class="stamp-info"><span class="eyebrow">SHINY STAMPS</span><strong id="stampValue">0 <small>/ 5</small></strong><small id="scoreValue">0 POINTS</small></div>
      </section>
      <section class="stage" id="gameStage" tabindex="0" aria-label="Frog courier game. Pull back anywhere to aim, then release to leap. Keyboard: Space to aim, arrows to adjust, Space to leap.">
        <div class="aim-gesture" id="aimGesture" aria-hidden="true" hidden><div class="aim-line" id="aimLine"></div><span class="aim-anchor"></span><span class="aim-knob" id="aimKnob"></span></div>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      </section>
      <footer class="play-controls" id="controls">
        <div class="control-copy"><strong id="controlTitle">PULL BACK. LET GO.</strong><span id="controlText">Touch anywhere. Drag down to leap up.</span></div>
        <div class="delivery-badge"><span id="badgeIcon" aria-hidden="true">↗</span><div><strong id="badgeValue">TAKE YOUR TIME</strong><small id="badgeText">MISSES GET ANOTHER HOP</small></div></div>
      </footer>
    </main>
    <div class="save-note" id="saveStatus" role="status">AUTOSAVE ON THIS DEVICE</div>
  </div>
  <div class="modal-layer" id="modalLayer" hidden><section class="panel" id="gamePanel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1"><div id="panelContent"></div></section></div>
  <div class="loading" id="loading"><span class="loading-letter" aria-hidden="true">✉</span><strong>Sorting the morning post…</strong></div>
  <noscript><div class="loading"><strong>JavaScript is needed to play.</strong><a href="./">Back to games</a></div></noscript>
  <script type="module" src="pondpost-main.js?v1"></script>
</body>
</html>
